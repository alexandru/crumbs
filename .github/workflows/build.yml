name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_name: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_name: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run checks
        working-directory: backend
        run: cargo xtask check

  docker:
    name: docker (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_name: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_name: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          tags: crumbs:smoke-${{ matrix.platform_name }}

      - name: Smoke test image
        env:
          IMAGE: crumbs:smoke-${{ matrix.platform_name }}
          CONTAINER: crumbs-smoke-${{ matrix.platform_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/crumbs-smoke.XXXXXX")"
          BODY="$TMP_DIR/body.json"
          HEADERS="$TMP_DIR/headers.txt"

          cleanup() {
            local trap_status=$?
            trap - EXIT
            if [ "$trap_status" -ne 0 ]; then
              echo "container logs:" >&2
              docker logs "$CONTAINER" >&2 || true
            fi
            docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
            rm -rf "$TMP_DIR"
            exit "$trap_status"
          }
          trap cleanup EXIT

          docker run --detach --name "$CONTAINER" --publish 127.0.0.1::8080 "$IMAGE" >/dev/null

          published="$(docker port "$CONTAINER" 8080/tcp 2>/dev/null | head -n 1 || true)"
          host_port="${published##*:}"
          if [ -z "$published" ] || ! [[ "$host_port" =~ ^[0-9]+$ ]]; then
            echo "could not determine the published host port" >&2
            exit 1
          fi

          status=""
          ready=0
          for _ in $(seq 1 30); do
            status="$(curl --silent --show-error --connect-timeout 1 --max-time 2 --output "$BODY" --dump-header "$HEADERS" --write-out '%{http_code}' "http://127.0.0.1:${host_port}/" 2>/dev/null || true)"
            if [ "$status" = "200" ] && grep -qiE '^content-type:[[:space:]]*text/html([[:space:]]*;.*)?[[:space:]]*$' "$HEADERS"; then
              ready=1
              break
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null || printf 'false')"
            if [ "$running" != "true" ]; then
              echo "container exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "timed out waiting for GET / to return HTTP 200 with text/html (last status: ${status:-none})" >&2
            if [ -s "$HEADERS" ]; then
              cat "$HEADERS" >&2
            fi
            exit 1
          fi

          grep -q 'Hello, welcome to Crumbs\.' "$BODY"

          for path in '/foods/search?query=chicken' '/mcp'; do
            status="$(curl --silent --show-error --connect-timeout 1 --max-time 2 --output "$BODY" --dump-header "$HEADERS" --write-out '%{http_code}' "http://127.0.0.1:${host_port}${path}" 2>/dev/null || true)"
            if [ "$status" != "401" ] || ! grep -qi '^www-authenticate:' "$HEADERS"; then
              echo "expected unauthenticated ${path} request to return 401 with WWW-Authenticate (got ${status:-none})" >&2
              exit 1
            fi
          done

          status="$(curl --silent --show-error --connect-timeout 1 --max-time 2 --output "$BODY" --dump-header "$HEADERS" --write-out '%{http_code}' "http://127.0.0.1:${host_port}/.well-known/oauth-authorization-server" 2>/dev/null || true)"
          if [ "$status" != "200" ] || ! grep -qiE '^content-type:[[:space:]]*application/json([[:space:]]*;.*)?[[:space:]]*$' "$HEADERS"; then
            echo "expected OAuth authorization-server discovery to return JSON (got ${status:-none})" >&2
            exit 1
          fi

          python3 - "$BODY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)

          expected_issuer = "https://crumbs.example.com"
          if payload.get("issuer") != expected_issuer:
              raise SystemExit(f"unexpected OAuth issuer: {payload.get('issuer')!r}")
          if "S256" not in payload.get("code_challenge_methods_supported", []):
              raise SystemExit("OAuth discovery does not advertise PKCE S256")
          PY

          sleep 2
          running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER")"
          if [ "$running" != "true" ]; then
            echo "container did not stay running until a termination signal" >&2
            exit 1
          fi

          docker stop --time 10 "$CONTAINER" >/dev/null
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER")"
          if [ "$exit_code" -ne 0 ]; then
            echo "container exited with status $exit_code after SIGTERM" >&2
            exit 1
          fi

          echo "image smoke test passed"
