[workspace]
members = ["database", "import", "server", "main", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.22"
bcrypt = "0.19.3"
getrandom = "0.3"
maud = { version = "0.27", features = ["axum"] }
rpassword = "7"
rust-embed = "8.13"
sha2 = "0.10"
subtle = "2.6"
url = { version = "2", features = ["serde"] }
zeroize = "1"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
crumbs-database = { path = "database" }
crumbs-import = { path = "import" }
crumbs-server = { path = "server" }
futures-executor = "0.3"
http = "1"
nix = { version = "0.31.3", features = ["process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
unicase = "2.10.0"
unicode-normalization = "0.1.26"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
