[workspace]
members = ["database", "server", "main", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crumbs-database = { path = "database" }
crumbs-server = { path = "server" }
nix = { version = "0.31.3", features = ["process", "signal"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "signal"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
